<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E3A26">
<meta name="description" content="Criação, manejo, abates e vendas para cunicultores. Funciona offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lepus">
<meta name="application-name" content="Lepus">
<link rel="icon" type="image/png" sizes="16x16" href="icon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Lepus — Cunicultura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,500&family=Outfit:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#F4EFE4; --paper:#FFFDF6; --ink:#22301E; --muted:#6E7A63;
  --line:#E3DCC8; --green:#2C5233; --deep:#1E3A26; --green-soft:#E7EDDE;
  --carrot:#D96E30; --carrot-soft:#F9E7D8; --bad:#B23A2E; --bad-soft:#F6E0DC;
  --oliva:#6B7A34; --amber:#A8741F; --amber-soft:#F3E8D2;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif;background:var(--deep);color:var(--ink);font-size:15px;line-height:1.45}
#app{position:relative;max-width:560px;margin:0 auto;min-height:100dvh;background:var(--bg);box-shadow:0 0 0 1px rgba(0,0,0,.25),0 0 60px rgba(0,0,0,.35)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,'Times New Roman',serif}
svg{display:block}

header#hdr{position:sticky;top:0;z-index:30;background:var(--bg);padding:calc(var(--sat) + 14px) 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header#hdr h1{font-size:21px;font-weight:650;line-height:1.1}
header#hdr p{font-size:12px;color:var(--muted);margin-top:1px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--green);flex:none;transition:transform .15s}
.iconbtn:active{transform:scale(.92)}
main#view{padding:6px 18px calc(170px + var(--sab))}

.hero{background:var(--deep);color:#F4EFE4;border-radius:20px;padding:20px;background-image:radial-gradient(rgba(244,239,228,.07) 1px,transparent 1.3px);background-size:14px 14px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.h-label{font-size:11.5px;text-transform:uppercase;letter-spacing:1.4px;color:rgba(244,239,228,.65);font-weight:600}
.h-val{font-family:'Fraunces',serif;font-size:36px;font-weight:650;margin-top:4px}
.h-sub{font-size:12px;color:rgba(244,239,228,.6);margin-top:2px}
.hero .bunny{width:62px;flex:none;color:rgba(244,239,228,.55);margin-top:2px}
.bunny.hop{animation:hop .8s cubic-bezier(.3,1.4,.4,1)}
@keyframes hop{0%{transform:translateY(0)}30%{transform:translateY(-9px) rotate(-6deg)}55%{transform:translateY(0)}72%{transform:translateY(-4px)}100%{transform:translateY(0)}}
.h-chart{margin-top:14px}
.earR{transform-box:view-box;transform-origin:49px 34px;animation:flick 5s infinite}
@keyframes flick{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(-15deg)}93%{transform:rotate(6deg)}}

.stats,.tira{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-top:14px;padding:13px 4px}
.tira{margin-bottom:16px}
.stat{flex:1;text-align:center;border-left:1px solid var(--line);padding:0 4px;min-width:0}
.stat:first-child{border-left:none}
.stat b{font-family:'Fraunces',serif;font-size:19px;font-weight:650;color:var(--deep);display:block;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

.alerta{display:flex;align-items:center;gap:10px;background:var(--amber-soft);border:1px solid #E8D3A2;border-radius:14px;padding:12px 14px;margin-top:14px;font-size:13px;font-weight:600;color:#7A5510;cursor:pointer}
.alerta svg{flex:none;color:var(--amber)}
.aviso{display:flex;gap:8px;align-items:flex-start;background:var(--bad-soft);color:var(--bad);border-radius:11px;padding:10px 12px;font-size:12.5px;font-weight:600;line-height:1.4}
.aviso svg{flex:none;margin-top:1px}

section{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sec-h h2{font-size:17.5px;font-weight:650}
.chip-meta{font-size:11px;font-weight:600;color:var(--green);background:var(--green-soft);padding:3px 10px;border-radius:999px}
.link{color:var(--carrot);font-weight:600;font-size:13px}
.grp-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:16px 2px 8px}
.sec-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:20px 2px 8px}

.row,.crow,.fila-row,.nrow,.carenc-row,.pk-row,.gest-row,.trow{
  background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;
  cursor:pointer;transition:transform .12s;width:100%;text-align:left;
}
.row:active,.crow:active,.fila-row:active,.nrow:active,.carenc-row:active,.pk-row:active,.gest-row:active,.trow:active{transform:scale(.985)}
.carenc-row{background:var(--amber-soft);border-color:#E8D3A2}
.trow.atras{background:var(--bad-soft);border-color:#E4B9B2}
.trow.hoje2{background:var(--amber-soft);border-color:#E8D3A2}
.gest-row.breve{border-color:#E8D3A2;background:var(--amber-soft)}
.row-ico{width:38px;height:38px;border-radius:12px;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.carenc-row .row-ico{background:#FFFDF6;color:var(--amber)}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main span{font-size:12px;color:var(--muted)}
.row-side{text-align:right;flex:none}
.row-side b{font-family:'Fraunces',serif;font-size:16px;font-weight:650;display:block}
.row-side span{font-size:11px;color:var(--muted)}
.tcheck{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.tcheck.on{background:var(--green-soft);border-color:var(--green-soft);color:var(--green)}
.tundo{width:34px;height:34px;border-radius:50%;background:#EFE9DA;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}

.ava{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:.3px;font-family:'Fraunces',serif}
img.ava{object-fit:cover}
.ava.f{background:var(--carrot-soft);color:#9C4A15}
.ava.m{background:var(--green-soft);color:var(--green)}
.ava.off{background:#ECE7DA;color:#8A8778}
.c-side{flex:none;text-align:right}
.c-side>b{display:block;font-size:13.5px;font-family:'Fraunces',serif}
.st{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2.5px 9px;border-radius:999px;margin-top:3px}
.st::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.st.matriz{background:var(--green-soft);color:var(--green)}
.st.reprodutor{background:#EAEEDA;color:var(--oliva)}
.st.engorda{background:var(--amber-soft);color:var(--amber)}
.st.vendido{background:#ECE7DA;color:#7C7768}
.st.abatido{background:var(--carrot-soft);color:#B04E14}
.st.morto{background:#E4E1D6;color:#6B675A}
.st.carencia{background:var(--amber-soft);color:var(--amber)}
.st.acasalada{background:var(--amber-soft);color:var(--amber)}
.st.prenhe{background:var(--green-soft);color:var(--green)}
.st.nascida{background:#EAEEDA;color:var(--oliva)}
.st.falhou{background:var(--bad-soft);color:var(--bad)}

.fr-main{flex:1;min-width:0}
.fr-main b{font-size:14px}
.fr-main>span{display:block;font-size:11.5px;color:var(--muted);margin:1px 0 6px}
.pbar{height:4px;background:#EAE4D2;border-radius:99px;overflow:hidden;max-width:170px}
.pbar i{display:block;height:100%;background:var(--green);border-radius:99px}
.pbar i.full{background:var(--carrot)}
.fr-w{flex:none;text-align:right}
.fr-w b{font-family:'Fraunces',serif;font-size:15.5px;font-weight:650;display:block}
.pronto{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:var(--carrot);border-radius:99px;padding:1.5px 8px;margin-top:3px;font-style:normal;letter-spacing:.4px}
em.pronto.caren{background:var(--amber)}

.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:46px;border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:0 14px 0 42px;font-size:16px}
.search input:focus{outline:none;border-color:var(--green)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--muted)}
.chip.on{background:var(--deep);color:#F4EFE4;border-color:var(--deep)}
.segmini{display:flex;background:#ECE5D2;border-radius:11px;padding:3px;margin-bottom:14px}
.segmini button{flex:1;padding:8px 2px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.segmini button.on{background:var(--paper);color:var(--deep);box-shadow:0 1px 3px rgba(40,50,30,.12)}

.empty{text-align:center;padding:34px 20px;color:var(--muted)}
.empty svg{margin:0 auto 10px;color:#B9B39E}
.empty b{display:block;color:var(--ink);font-family:'Fraunces',serif;font-size:16px;font-weight:650}
.empty p{font-size:13px;margin-top:3px}

nav#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:40;width:100%;max-width:560px;background:var(--paper);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + var(--sab))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A9070;font-size:10px;font-weight:600;padding:5px 0;border-radius:12px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--deep)}
.tab.on .pill{background:var(--green-soft)}
.pill{display:flex;align-items:center;padding:4px 12px;border-radius:999px}
#fab{position:fixed;z-index:39;right:max(16px,calc(50vw - 264px));bottom:calc(84px + var(--sab));background:var(--deep);color:#F4EFE4;border-radius:999px;padding:14px 20px;display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px;box-shadow:0 8px 22px rgba(20,35,18,.35);transition:transform .15s}
#fab:active{transform:scale(.94)}
#fab svg{width:18px;height:18px}

.ov{position:fixed;inset:0;z-index:100;background:rgba(22,30,16,.5);opacity:0;transition:opacity .25s}
.ov.on{opacity:1}
.ov.out{opacity:0}
.sheet{position:absolute;bottom:0;left:50%;transform:translate(-50%,105%);width:100%;max-width:560px;max-height:90dvh;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;transition:transform .32s cubic-bezier(.32,.72,.24,1)}
.ov.on .sheet{transform:translate(-50%,0)}
.ov.out .sheet{transform:translate(-50%,105%)}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;flex:none}
.sh-head h3{font-size:19px;font-weight:650}
.sh-body{overflow-y:auto;padding:4px 18px 22px}
.sh-foot{flex:none;padding:12px 18px calc(14px + var(--sab));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet.mini{max-width:400px}
.form{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.fld label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:11px 13px;font-size:16px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(44,82,51,.13)}
.fld textarea{min-height:70px;resize:vertical}
.frow{display:flex;gap:10px}
.frow>.fld{flex:1}
.seg{display:flex;background:#ECE5D2;border-radius:11px;padding:3px}
.seg button{flex:1;padding:9px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--deep);box-shadow:0 1px 3px rgba(40,50,30,.12)}
.btn{min-height:48px;border-radius:13px;padding:12px 18px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;flex:1}
.btn.primary{background:var(--deep);color:#F4EFE4}
.btn.primary:active{transform:scale(.97)}
.btn.ghost{background:var(--paper);border:1px solid var(--line);color:var(--deep)}
.btn.danger{background:var(--bad);color:#fff}
.btn.danger-l{background:var(--bad-soft);color:var(--bad)}
.hint{font-size:12px;color:var(--muted);line-height:1.45}

.it-tools{display:flex;gap:8px;margin-bottom:10px}
.it-tools button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;font-size:13.5px;font-weight:600;color:var(--green);background:var(--green-soft);border-radius:11px}
.it-tools button.sec{color:var(--muted);background:#EFE9DA}
.it-row{display:grid;grid-template-columns:1fr 50px 58px 78px 28px;gap:6px;margin-bottom:8px;align-items:center}
.it-row input,.it-row select{min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:8px 9px;font-size:15px;width:100%}
.it-row .i-x{width:28px;height:38px;border-radius:9px;color:var(--muted);display:flex;align-items:center;justify-content:center;background:#EFE9DA}
.vtot{display:flex;align-items:baseline;justify-content:space-between;flex:1}
.vtot span{font-size:12px;color:var(--muted);font-weight:600}
.vtot b{font-family:'Fraunces',serif;font-size:23px;font-weight:650;color:var(--deep)}

.d-head{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.d-ava{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:650;font-size:18px}
img.d-ava{object-fit:cover}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.d-cell{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
.d-cell span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}
.d-cell b{font-size:14px;word-wrap:break-word}
.d-acts{display:flex;flex-wrap:wrap;gap:8px}
.d-acts .btn{flex:1 1 calc(50% - 4px);min-height:44px;font-size:13.5px}

.recibo{background:#fff;border:1.5px solid var(--ink);outline:1px solid var(--ink);outline-offset:3px;padding:20px 18px;margin:6px 4px 14px;border-radius:2px}
.r-head{text-align:center;border-bottom:1.5px solid var(--ink);padding-bottom:12px}
.r-logo{width:52px;height:52px;border-radius:50%;background:var(--deep);color:#F4EFE4;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.r-logo svg{width:32px;height:32px}
.r-name{font-family:'Fraunces',serif;font-size:20px;font-weight:650}
.r-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.r-title{text-align:center;margin:13px 0 3px;font-weight:700;letter-spacing:2px;font-size:13.5px}
.r-title small{display:block;font-weight:400;letter-spacing:.5px;font-size:9.5px;color:var(--muted);margin-top:2px}
.r-info{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin:12px 0;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--bg)}
.r-info b{display:block;font-size:13px}
.r-info span{color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.r-info .col{min-width:0}
.r-info .right{text-align:right}
table.r-items{width:100%;border-collapse:collapse;font-size:12.5px}
table.r-items th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);border-bottom:1px solid var(--ink);padding:4px 2px}
table.r-items td{padding:6px 2px;border-bottom:1px dashed var(--line);vertical-align:top}
.r-items .num{text-align:right;white-space:nowrap}
.r-subline{font-size:10px;color:var(--muted);margin-top:1px}
.r-tots{margin-top:10px;font-size:12.5px}
.r-tots .tr{display:flex;justify-content:space-between;padding:2.5px 2px;color:var(--muted)}
.r-tots .grand{background:var(--deep);color:#F4EFE4;border-radius:8px;padding:8px 12px;margin-top:6px;font-weight:700;font-size:14.5px;justify-content:space-between}
.r-obs{font-size:11.5px;color:var(--muted);margin-top:9px;font-style:italic}
.ficha{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-top:8px}
.ficha-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.ficha-h b{font-family:'Fraunces',serif;font-size:14px}
.ficha-h span{font-size:10.5px;color:var(--muted)}
.ficha-l{font-size:12px;margin-top:2px;line-height:1.45}
.r-sign{text-align:center;margin-top:26px;font-size:11px;color:var(--muted)}
.r-sign i{display:block;width:200px;border-top:1px solid var(--ink);margin:0 auto 5px;font-style:normal}
.r-foot{text-align:center;font-size:9.5px;color:var(--muted);margin-top:16px;border-top:1px solid var(--line);padding-top:8px}

#toastRoot{position:fixed;z-index:200;bottom:calc(96px + var(--sab));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:88vw}
.toast{background:var(--deep);color:#F4EFE4;border-radius:999px;padding:11px 18px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:9px;box-shadow:0 10px 26px rgba(15,25,12,.4);animation:tin .35s cubic-bezier(.3,1.3,.4,1);max-width:88vw}
.toast svg{width:17px;height:17px;color:#A9C79A;flex:none}
.toast.err svg{color:#F0A08F}
.toast.hide{opacity:0;transform:translateY(8px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.9)}}

.clist{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:10px}
.clist button{display:flex;width:100%;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;text-align:left}
.clist button:last-child{border-bottom:none}
.clist button svg{color:var(--green);flex:none}
.clist button small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.clist .red,.clist .red svg{color:var(--bad)}
.stbox{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-top:10px;padding:6px 15px;font-size:13px}
.stbox .l{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.stbox .l:last-child{border-bottom:none}
.stbox .l span{color:var(--muted)}
.stbox .l b{text-align:right;font-weight:600}

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2));
const isoHoje = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const diasAtras = n => { const d = new Date(); d.setDate(d.getDate()-n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const addDias = (iso, n) => { const d = new Date(iso+'T00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtData = s => s ? s.split('-').reverse().join('/') : '—';
const fmtDataHora = d => d.toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtMoeda = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtKg = n => (Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:2}) + ' kg';
const fmtNum = n => (Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const fmtCurto = v => v >= 1000 ? (v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil' : String(Math.round(v));
function idade(d){
  if(!d) return '—';
  const n = new Date(); const b = new Date(d+'T00:00');
  let m = (n.getFullYear()-b.getFullYear())*12 + (n.getMonth()-b.getMonth());
  let dd = n.getDate()-b.getDate(); if(dd<0){ m--; dd+=30; }
  if(m<0) return '—';
  const a = Math.floor(m/12); m = m%12;
  return a>0 ? a+' a '+m+' m' : m>0 ? m+' m '+dd+' d' : dd+' d';
}
const vendaTotal = v => v.itens.reduce((s,i)=> s + (Number(i.qtd)||0)*(Number(i.preco)||0), 0) - (Number(v.desconto)||0);

/* ---------- Predefinidos ---------- */
const RACAS_BASE = ['Nova Zelândia Branca','Californiano','Branco de Vila Real','Chinchila','Gigante de Flandres','Angorá','Rex','Belo Holandês','Mestiço'];

];

];
const racasTodas = () => RACAS_BASE.concat(db.settings.racasCustom || []);

/* ---------- Banco local (com migração) ---------- */
const LS = 'lepus_db_v1';
const dbPadrao = () => ({ settings:{configurado:false, nome:'', responsavel:'', telefone:'', cidade:'', pesoAlvo:3.5, racasCustom:[]},
  coelhos:[], ninhadas:[], acasalamentos:[], tarefas:[], abates:[], vendas:[], sanidade:[], alimentacao:[] });
function normalizaDb(d){
  const p = dbPadrao();
  const out = Object.assign({}, p, (d && typeof d === 'object') ? d : {});
  out.settings = Object.assign({}, p.settings, (d && d.settings) || {});
  if(!Array.isArray(out.settings.racasCustom)) out.settings.racasCustom = [];
  ['coelhos','ninhadas','acasalamentos','tarefas','abates','vendas','sanidade','alimentacao'].forEach(k => { if(!Array.isArray(out[k])) out[k] = []; });
  const renomeia = (de, para) => out.coelhos.forEach(c => { if(c.raca === de) c.raca = para; });
  renomeia('Flanders', 'Gigante de Flandres');
  renomeia('Branco de Vila Récal', 'Branco de Vila Real');
  return out;
}
let db;
try{ db = normalizaDb(JSON.parse(localStorage.getItem(LS))); }catch(e){ db = dbPadrao(); }
const save = () => { try{ localStorage.setItem(LS, JSON.stringify(db)); }catch(e){ toast('Memória cheia — reduza fotos ou exporte backup','x',true); } };

const STATUS_L = { matriz:'Matriz', reprodutor:'Reprodutor', engorda:'Engorda', vendido:'Vendido', abatido:'Abatido', morto:'Óbito' };
const GEST_L = { acasalada:'Acasalada', prenhe:'Prenhe', nascida:'Nascida', falhou:'Falhou' };
const ativos = () => db.coelhos.filter(c => !['vendido','abatido','morto'].includes(c.status));
const porId = id => db.coelhos.find(c => c.id === id);
const nomeCoelho = id => { const c = porId(id); return c ? c.brinco : '—'; };
const proxNum = () => Math.max(0, ...db.vendas.map(v=>v.num||0)) + 1;

function carenciaCoelho(c){
  const hoje = isoHoje(); let melhor = null;
  db.sanidade.forEach(s => {
    const dias = Number(s.carenciaDias)||0;
    if(dias <= 0 || !s.data) return;
    const fim = addDias(s.data, dias);
    if(fim < hoje) return;
    let atinge = false;
    if(s.alvoTipo === 'individual') atinge = s.coelhoId === c.id;
    else if(s.alvoTipo === 'grupo'){
      if(s.grupo === 'ativos') atinge = !['vendido','abatido','morto'].includes(c.status);
      else atinge = c.status === s.grupo;
    }
    if(atinge && (!melhor || fim > melhor.fim)) melhor = { fim, med:s.med };
  });
  return melhor;
}
function alvoDesc(s){
  if(s.alvoTipo === 'individual'){ const c = porId(s.coelhoId); return c ? 'Coelho '+c.brinco : 'Coelho (removido)'; }
  return { matriz:'Todas as matrizes', reprodutor:'Reprodutores', engorda:'Engorda (lote)', ativos:'Plantel ativo' }[s.grupo] || '—';
}

/* ---------- Estado ---------- */
const state = { tab:'painel', filtro:'todos', q:'', sub:'plantel', msub:'sanidade' };
const TABS = [
  {id:'painel',  label:'Painel',  icon:'home'},
  {id:'coelhos', label:'Coelhos', icon:'rabbit'},
  {id:'manejo',  label:'Manejo',  icon:'pulse'},
  {id:'abates',  label:'Abates',  icon:'knife'},
  {id:'vendas',  label:'Vendas',  icon:'tag'}
];

function hopBunny(){
  const b = $('#hdr').querySelector('.bunny');
  if(b){ b.classList.add('hop'); setTimeout(()=>b.classList.remove('hop'), 900); }
}
function toast(msg, icon='check', err=false){
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.innerHTML = ic(err ? 'x' : icon, 17) + '<span>' + esc(msg) + '</span>';
  $('#toastRoot').appendChild(t);
  setTimeout(()=>{ t.classList.add('hide'); setTimeout(()=>t.remove(), 320); }, 2600);
}
function openSheet(title, bodyHTML, opts={}){
  const ov = document.createElement('div');
  ov.className = 'ov';
  ov.innerHTML = `<div class="sheet ${opts.cls||''}"><div class="sh-head"><h3>${title}</h3>
    <button class="iconbtn sh-x" aria-label="Fechar">${ic('x')}</button></div>
    <div class="sh-body">${bodyHTML}</div>${opts.foot ? `<div class="sh-foot">${opts.foot}</div>` : ''}</div>`;
  document.body.appendChild(ov);
  requestAnimationFrame(()=> requestAnimationFrame(()=> ov.classList.add('on')));
  const close = () => { ov.classList.remove('on'); ov.classList.add('out'); setTimeout(()=>ov.remove(), 300); };
  ov.close = close;
  ov.addEventListener('click', e => { if(e.target === ov && !opts.locked) close(); });
  ov.querySelector('.sh-x').onclick = close;
  return ov;
}
function confirmSheet(titulo, msg, acao, cb){
  const sh = openSheet(esc(titulo),
    `<p class="hint" style="font-size:13.5px;margin-top:2px">${esc(msg)}</p>
     <div class="d-acts" style="margin-top:18px">
       <button class="btn ghost" data-a="n">Cancelar</button>
       <button class="btn danger" data-a="y">${esc(acao)}</button>
     </div>`, {cls:'mini'});
  sh.querySelector('[data-a=n]').onclick = sh.close;
  sh.querySelector('[data-a=y]').onclick = () => { sh.close(); cb(); };
}

function renderHeader(){
  let t, s;
  if(state.tab === 'painel'){
    t = esc(db.settings.nome || 'Lepus');
    s = new Date().toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
  } else if(state.tab === 'coelhos'){
    t = 'Coelhos'; s = ativos().length + ' ativos · ' + db.coelhos.length + ' registros';
  } else if(state.tab === 'manejo'){
    t = 'Manejo'; s = db.tarefas.filter(t=>!t.concluida).length + ' tarefas pendentes';
  } else if(state.tab === 'abates'){
    t = 'Abates'; s = db.abates.length + ' registros';
  } else {
    t = 'Vendas'; s = db.vendas.length + ' vendas emitidas';
  }
  $('#hdr').innerHTML = `<div class="h-l"><h1>${t}</h1><p>${s}</p></div>
    <div class="h-r">${window._installEvt ? `<button class="iconbtn" id="btnInstallHdr" aria-label="Instalar app">${ic('install')}</button>` : ''}
    <button class="iconbtn" id="btnCfg" aria-label="Configurações">${ic('gear')}</button></div>`;
  $('#btnCfg').onclick = sheetConfig;
  if($('#btnInstallHdr')) $('#btnInstallHdr').onclick = tentarInstalar;
}
function renderFab(){
  const fab = $('#fab');
  let label = 'Nova venda';
  if(state.tab === 'coelhos') label = state.sub==='plantel' ? 'Novo coelho' : state.sub==='repro' ? 'Novo acasalamento' : 'Nova ninhada';
  if(state.tab === 'manejo')  label = state.msub==='sanidade' ? 'Nova aplicação' : state.msub==='alimentacao' ? 'Nova ração' : 'Nova tarefa';
  if(state.tab === 'abates')  label = 'Novo abate';
  fab.innerHTML = ic('plus', 18) + '<span>' + label + '</span>';
  fab.onclick = () => {
    if(state.tab === 'coelhos'){
      if(state.sub === 'plantel') sheetCoelho();
      else if(state.sub === 'repro') sheetAcasalamento();
      else sheetNinhada();
    }
    else if(state.tab === 'manejo'){
      if(state.msub === 'sanidade') sheetSanidade();
      else if(state.msub === 'alimentacao') sheetAlimentacao();
      else sheetTarefa();
    }
    else if(state.tab === 'abates') sheetAbate();
    else sheetVenda();
  };
}
function render(){
  renderHeader(); renderFab();
  $('#tabbar').innerHTML = TABS.map(t =>
    `<button class="tab ${state.tab===t.id?'on':''}" data-tab="${t.id}">
       <span class="pill">${ic(t.icon,22)}</span><span>${t.label}</span></button>`).join('');
  $$('#tabbar .tab').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); window.scrollTo(0,0); });
  if(state.tab === 'painel') viewPainel();
  else if(state.tab === 'coelhos') viewCoelhos();
  else if(state.tab === 'manejo') viewManejo();
  else if(state.tab === 'abates') viewAbates();
  else viewVendas();
}

/* ============================================================
   PAINEL
   ============================================================ */
function svgBars(){
  const meses = [];
  for(let i=5; i>=0; i--){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    meses.push({ key: d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),
      label: d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''), total:0 });
  }
  db.vendas.forEach(v => { const m = meses.find(x => x.key === (v.data||'').slice(0,7)); if(m) m.total += vendaTotal(v); });
  const max = Math.max(...meses.map(m=>m.total), 1);
  const W=340, H=152, pad=8, bw=(W-pad*2)/6;
  let bars = '';
  meses.forEach((m,i)=>{
    const h = Math.max((m.total/max)*(H-56), 2);
    const x = pad + i*bw + 9, wid = bw-18, y = H-40-h;
    const cur = i===5;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${wid.toFixed(1)}" height="${h.toFixed(1)}" rx="5" fill="${cur?'#E07A3F':'rgba(244,239,228,.5)'}"/>
      <text x="${(x+wid/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="600" fill="${cur?'#E8945F':'rgba(244,239,228,.8)'}">${m.total?fmtCurto(m.total):''}</text>

  });

function viewPainel(){
  const at = ativos();
  const hoje = isoHoje();
  const mesKey = hoje.slice(0,7);
  const vendasMes = db.vendas.filter(v => (v.data||'').slice(0,7) === mesKey);
  const totalMes = vendasMes.reduce((s,v)=>s+vendaTotal(v),0);
  const totalGeral = db.vendas.reduce((s,v)=>s+vendaTotal(v),0);
  const mesNome = new Date().toLocaleDateString('pt-BR',{month:'long'});
  const alvo = Number(db.settings.pesoAlvo)||3.5;
  const fila = at.filter(c => c.status==='engorda' && c.peso>0).sort((a,b)=>b.peso-a.peso).slice(0,5);
  const ultimas = [...db.vendas].sort((a,b)=> (b.data||'').localeCompare(a.data||'') || (b.num||0)-(a.num||0)).slice(0,3);
  const emCarencia = at.filter(c => carenciaCoelho(c));
  const aNascer = db.acasalamentos.filter(g => ['acasalada','prenhe'].includes(g.status) && g.prevista && g.prevista <= addDias(hoje,3)).sort((a,b)=>a.prevista.localeCompare(b.prevista));
  const tPend = db.tarefas.filter(t => !t.concluida && (t.data||'') <= hoje).sort((a,b)=>(a.data||'').localeCompare(b.data||''));

  const filaHTML = fila.length ? fila.map(c => {
    const pct = Math.min(100, Math.round(c.peso/alvo*100));

    return `<div class="fila-row" data-id="${c.id}">
      <div class="fr-main"><b>${esc(c.brinco)}</b><span>${esc(c.raca||'—')} · ${idade(c.nascimento)}</span>

      <div class="fr-w"><b>${fmtKg(c.peso)}</b>${car
        ? `<em class="pronto caren">carência ${fmtData(car.fim)}</em>`

  const vendasHTML = ultimas.length ? ultimas.map(v =>
    `<div class="row" data-id="${v.id}"><div class="row-ico">${ic('tag',19)}</div>
      <div class="row-main"><b>#${String(v.num).padStart(4,'0')} · ${esc(v.cliente||'Consumidor')}</b>
      <span>${v.itens.length} ${v.itens.length>1?'itens':'item'} · ${fmtData(v.data)}</span></div>
      <div class="row-side"><b>${fmtMoeda(vendaTotal(v))}</b><span>${esc(v.pagamento||'')}</span></div></div>`).join('')
    : `<div class="empty">${ic('tag',30)}<b>Sem vendas ainda</b><p>Toque em “Nova venda” para emitir o primeiro recibo.</p></div>`;

  const agendaHTML = (aNascer.length || tPend.length) ? `
    <section>
      <div class="sec-h"><h2>Agenda de hoje</h2></div>
      ${aNascer.map(g => `<button class="gest-row" data-id="${g.id}"><div class="row-ico">${ic('eggs',18)}</div>
        <div class="row-main"><b>${esc(nomeCoelho(g.matrizId))} × ${esc(nomeCoelho(g.padraoId))}</b>
        <span>Parto previsto para ${fmtData(g.prevista)}</span></div>
        <span class="st ${g.prevista<=hoje?'falhou':'acasalada'}">${g.prevista<=hoje?'nasceu?':'a nascer'}</span></button>`).join('')}
      ${tPend.length ? `<div class="row" id="agendaTarefas"><div class="row-ico">${ic('tarefa',18)}</div>
        <div class="row-main"><b>${tPend.length} tarefa${tPend.length>1?'s':''} pendente${tPend.length>1?'s':''}</b>
        <span>Próxima: ${esc(tPend[0].titulo)} · ${fmtData(tPend[0].data)}</span></div>
        <span class="st ${tPend[0].data<hoje?'falhou':'acasalada'}">${tPend[0].data<hoje?'atrasada':'hoje'}</span></div>` : ''}
    </section>` : '';

  $('#view').innerHTML = `
    <section class="hero">
      <div class="hero-top">
        <div>
          <div class="h-label">Vendas de ${mesNome}</div>
          <div class="h-val">${fmtMoeda(totalMes)}</div>
          <div class="h-sub">${vendasMes.length} venda${vendasMes.length===1?'':'s'} este mês · ${fmtMoeda(totalGeral)} acumulado</div>
        </div>
        ${bunnySVG('')}
      </div>
      <div class="h-chart">${svgBars()}</div>
    </section>
    ${emCarencia.length ? `<div class="alerta" id="alertaCar">${ic('warn',18)}<span>${emCarencia.length} coelho${emCarencia.length>1?'s':''} em carência de abate — toque para ver</span></div>` : ''}

      <div class="stat"><b>${at.length}</b><span>Plantel</span></div>
      <div class="stat"><b>${at.filter(c=>c.status==='matriz').length}</b><span>Matrizes</span></div>
      <div class="stat"><b>${db.acasalamentos.filter(g=>['acasalada','prenhe'].includes(g.status)).length}</b><span>Gestações</span></div>

  const ag = $('#agendaTarefas'); if(ag) ag.onclick = () => { state.tab='manejo'; state.msub='tarefas'; render(); };
  $$('#view .fila-row').forEach(r => r.onclick = () => sheetDetalhe(r.dataset.id));
  $$('#view .gest-row').forEach(r => r.onclick = () => sheetGestDet(r.dataset.id));
  $$('#view .row').forEach(r => r.onclick = () => sheetRecibo(r.dataset.id));
}

function avaCls(c){ return ['vendido','abatido','morto'].includes(c.status) ? 'off' : (c.sexo==='F' ? 'f' : 'm'); }
function avaHTML(c, cls){
  if(c.foto) return `<img class="${cls} ${avaCls(c)}" src="${c.foto}" alt="">`;
  return `<div class="${cls} ${avaCls(c)}">${esc((c.brinco||'?').replace(/\D/g,'').slice(-2) || (c.brinco||'?').slice(0,2))}</div>`;
}

function listaCoelhosHTML(){
  const q = state.q.toLowerCase();
  let lista = db.coelhos.filter(c =>
    (state.filtro==='todos' && !['vendido','abatido','morto'].includes(c.status)) ||
    (state.filtro==='matriz' && c.status==='matriz') ||
    (state.filtro==='reprodutor' && c.status==='reprodutor') ||
    (state.filtro==='engorda' && c.status==='engorda') ||
    (state.filtro==='arq' && ['vendido','abatido','morto'].includes(c.status))
  );
  if(q) lista = lista.filter(c => ((c.brinco||'')+' '+(c.nome||'')+' '+(c.raca||'')+' '+(c.jaula||'')).toLowerCase().includes(q));
  lista.sort((a,b)=> (a.brinco||'').localeCompare(b.brinco||'', 'pt-BR', {numeric:true}));
  if(!lista.length) return `<div class="empty">${bunnySVG('')}<b>Nenhum coelho aqui</b><p>Ajuste o filtro ou toque em “Novo coelho”.</p></div>`;
  return lista.map(c =>
    `<div class="crow" data-id="${c.id}">
      ${avaHTML(c,'ava')}
      <div class="row-main"><b>${esc(c.brinco)}${c.nome ? ' · '+esc(c.nome) : ''}</b>
        <span>${c.jaula?'Jaula '+esc(c.jaula)+' · ':''}${esc(c.raca||'—')} · ${idade(c.nascimento)}</span></div>
      <div class="c-side"><b>${c.peso ? fmtKg(c.peso) : '—'}</b>
        <span class="st ${c.status}">${STATUS_L[c.status]}</span></div>
    </div>`).join('');
}

function listaReproHTML(){
  if(!db.acasalamentos.length) return `<div class="empty">${ic('heart',34)}<b>Nenhum acasalamento</b><p>Registre a cobertura da matriz para acompanhar a gestação e o parto previsto.</p></div>`;
  const hoje = isoHoje();
  const lista = [...db.acasalamentos].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  return lista.map(g => {
    const ativa = ['acasalada','prenhe'].includes(g.status);
    const dias = g.prevista ? Math.round((new Date(g.prevista+'T00:00') - new Date(hoje+'T00:00'))/864e5) : null;
    let sub = `Acasalado ${fmtData(g.data)} · previsto ${fmtData(g.prevista)}`;
    if(g.status==='nascida') sub = `Acasalado ${fmtData(g.data)} · nascimento registrado`;
    if(g.status==='falhou')  sub = `Acasalado ${fmtData(g.data)} · não houve nascimento`;
    return `<div class="gest-row ${ativa && dias!==null && dias<=3 ? 'breve':''}" data-id="${g.id}">
      <div class="row-ico">${ic('heart',18)}</div>
      <div class="row-main"><b>${esc(nomeCoelho(g.matrizId))} × ${esc(nomeCoelho(g.padraoId))}</b>
        <span>${sub}</span></div>
      <div class="row-side">${ativa && dias!==null && dias>=0 && dias<=31 ? `<b>${dias}</b><span>${dias===0?'hoje':'dias'}</span>` : ''}
        <span class="st ${g.status}">${GEST_L[g.status]}</span></div>
    </div>`;
  }).join('');
}

function sugestaoBrinco(){
  const nums = db.coelhos.map(c => { const m = (c.brinco||'').match(/\d+/); return m ? parseInt(m[0],10) : 0; });
  return String(Math.max(0, ...nums) + 1).padStart(3, '0');

function comprimeFoto(file, cb){
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 480, k = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width*k));
      c.height = Math.max(1, Math.round(img.height*k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.72));
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

function sparkline(pesos){
  if(!pesos || pesos.length < 2) return '';
  const W=220, H=44, p=5;
  const ps = [...pesos].sort((a,b)=>a.d.localeCompare(b.d));
  const min = Math.min(...ps.map(x=>x.kg)), max = Math.max(...ps.map(x=>x.kg));
  const rng = (max-min) || 1;
  const pts = ps.map((x,i)=> [p + i*(W-2*p)/(ps.length-1), H-p - ((x.kg-min)/rng)*(H-2*p)]);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="46" style="margin-top:6px">
    <polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="#2C5233" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#D96E30"/>`).join('')}</svg>`;
}

      ${gestAtiva ? `<div class="d-cell" style="grid-column:1/-1;background:var(--green-soft);border-color:#CFDDC4"><span>Gestação em curso</span><b>Parto previsto ${fmtData(gestAtiva.prevista)}</b></div>` : ''}
      ${ultima ? `<div class="d-cell" style="grid-column:1/-1"><span>Última aplicação</span><b>${esc(ultima.med)} · ${fmtData(ultima.data)}</b></div>` : ''}
      ${car ? `<div class="d-cell" style="grid-column:1/-1;background:var(--amber-soft);border-color:#E8D3A2"><span>Carência para abate</span><b>${esc(car.med)} · até ${fmtData(car.fim)}</b></div>` : ''}
    </div>

      db.coelhos = db.coelhos.filter(x=>x.id!==id);

      db.acasalamentos = db.acasalamentos.filter(g => g.matrizId!==id && g.padraoId!==id);

      db.tarefas = db.tarefas.filter(t => t.coelhoId!==id);
      save(); toast('Registro excluído'); render();
    });

function sheetPeso(id){
  const c = porId(id); if(!c) return;
  const sh = openSheet('Registrar peso — ' + esc(c.brinco), `
    <div class="form">
      <div class="fld"><label>Novo peso (kg)</label><input id="pKg" type="number" inputmode="decimal" min="0" step="0.01" value="${c.peso||''}" placeholder="3,50"></div>
      <button class="btn primary" id="pSal">${ic('check',18)} Salvar peso</button>
    </div>`, {cls:'mini'});
  sh.querySelector('#pSal').onclick = () => {
    const kg = parseFloat(sh.querySelector('#pKg').value);
    if(!kg || kg<=0) return toast('Informe um peso válido','x',true);
    c.peso = kg; (c.pesos = c.pesos||[]).push({d:isoHoje(), kg});
    save(); sh.close(); toast('Peso de '+c.brinco+' atualizado'); render();
  };
}

/* ---------- Acasalamento / Gestação ---------- */
const GESTACAO_DIAS = 31;

function sheetAcasalamento(matrizIdPre){
  const femeas = db.coelhos.filter(c=>c.sexo==='F' && c.status==='matriz');
  const machos = db.coelhos.filter(c=>c.sexo==='M' && !['vendido','abatido','morto'].includes(c.status));
  if(!femeas.length || !machos.length) return toast('Cadastre ao menos uma matriz e um reprodutor','x',true);
  const sh = openSheet('Novo acasalamento', `
    <div class="form">
      <div class="frow">
        <div class="fld"><label>Matriz *</label><select id="gMae"><option value="">Selecione</option>${femeas.map(c =>
          `<option value="${c.id}" ${matrizIdPre===c.id?'selected':''}>${esc(c.brinco)}${c.nome?' · '+esc(c.nome):''}</option>`).join('')}</select></div>
        <div class="fld"><label>Padreador *</label><select id="gPai"><option value="">Selecione</option>${machos.map(c =>
          `<option value="${c.id}">${esc(c.brinco)}${c.nome?' · '+esc(c.nome):''}</option>`).join('')}</select></div>
      </div>
      <div class="fld"><label>Data do acasalamento</label><input id="gData" type="date" value="${isoHoje()}"></div>
      <p class="hint" id="gPrev"></p>
      <div class="fld"><label>Observações</label><textarea id="gObs" placeholder="Cobertura confirmada, comportamento…"></textarea></div>
      <button class="btn primary" id="gSal">${ic('check',18)} Registrar acasalamento</button>
      <p class="hint" style="text-align:center">A gestação média da coelha dura ${GESTACAO_DIAS} dias. A data prevista é calculada automaticamente.</p>
    </div>`);
  const upd = () => {
    const d = sh.querySelector('#gData').value;
    sh.querySelector('#gPrev').innerHTML = d ? `Parto previsto: <b>${fmtData(addDias(d, GESTACAO_DIAS))}</b>` : '';
  };
  sh.querySelector('#gData').onchange = upd; upd();
  sh.querySelector('#gSal').onclick = () => {
    const mae = sh.querySelector('#gMae').value, pai = sh.querySelector('#gPai').value;
    if(!mae || !pai) return toast('Selecione matriz e padreador','x',true);
    if(mae === pai) return toast('Matriz e padreador não podem ser o mesmo animal','x',true);
    const dupla = db.acasalamentos.find(g => g.matrizId===mae && ['acasalada','prenhe'].includes(g.status));
    if(dupla) return toast('Esta matriz já tem uma gestação em andamento','x',true);
    const data = sh.querySelector('#gData').value || isoHoje();
    db.acasalamentos.push({ id:uid(), matrizId:mae, padraoId:pai, data,
      prevista:addDias(data, GESTACAO_DIAS), status:'acasalada',
      obs:sh.querySelector('#gObs').value.trim() });
    save(); sh.close(); toast('Acasalamento registrado'); render();
  };
}

function sheetGestDet(id){
  const g = db.acasalamentos.find(x=>x.id===id); if(!g) return;
  const hoje = isoHoje();
  const dias = g.prevista ? Math.round((new Date(g.prevista+'T00:00') - new Date(hoje+'T00:00'))/864e5) : null;
  const ativa = ['acasalada','prenhe'].includes(g.status);
  const sh = openSheet('Gestação', `
    <div class="d-grid">
      <div class="d-cell"><span>Matriz</span><b>${esc(nomeCoelho(g.matrizId))}</b></div>
      <div class="d-cell"><span>Padreador</span><b>${esc(nomeCoelho(g.padraoId))}</b></div>
      <div class="d-cell"><span>Acasalamento</span><b>${fmtData(g.data)}</b></div>
      <div class="d-cell"><span>Parto previsto</span><b>${fmtData(g.prevista)}</b></div>
      <div class="d-cell"><span>Status</span><b>${GEST_L[g.status]}</b></div>
      <div class="d-cell"><span>${dias!==null && dias>=0 ? 'Dias p/ parto' : 'Situação'}</span><b>${ativa ? (dias===null?'—':dias>=0?(dias===0?'Hoje':dias+' d'):'Atrasado '+(dias*-1)+' d') : 'Encerrada'}</b></div>
    </div>
    ${g.obs ? `<p class="hint" style="font-size:13px"><b>Obs.:</b> ${esc(g.obs)}</p>` : ''}
    ${ativa ? `<p class="hint" style="margin-top:10px">A palpação pode ser feita entre o 10º e o 14º dia após o acasalamento.</p>` : ''}
    <div class="d-acts" style="margin-top:16px">
      ${g.status==='acasalada' ? `<button class="btn primary" id="gdPrenhe">${ic('check',17)} Confirmar prenhez</button>` : ''}
      ${ativa ? `<button class="btn primary" id="gdNasc">${ic('eggs',17)} Dar à luz</button>
                 <button class="btn ghost" id="gdFalha">Registrar falha</button>` : ''}
      <button class="btn danger-l" id="gdDel">${ic('trash',17)} Excluir</button>
    </div>`);
  const pren = sh.querySelector('#gdPrenhe');
  if(pren) pren.onclick = () => { g.status='prenhe'; save(); sh.close(); toast('Prenhez confirmada'); render(); };
  const nasc = sh.querySelector('#gdNasc');
  if(nasc) nasc.onclick = () => { sh.close(); sheetNinhada(null, { matrizId:g.matrizId, padraoId:g.padraoId, gestId:g.id }); };
  const falha = sh.querySelector('#gdFalha');
  if(falha) falha.onclick = () => confirmSheet('Registrar falha',
    'A gestação será encerrada como falha (não houve nascimento).', 'Registrar', () => {
      g.status='falhou'; save(); sh.close(); toast('Falha registrada'); render();
    });
  sh.querySelector('#gdDel').onclick = () => confirmSheet('Excluir gestação',
    'O registro do acasalamento será apagado.', 'Excluir', () => {
      db.acasalamentos = db.acasalamentos.filter(x=>x.id!==id);
      save(); sh.close(); toast('Registro excluído'); render();
    });
}

/* ---------- Ninhadas ---------- */
function sheetNinhada(id, pre){
  const n = id ? db.ninhadas.find(x=>x.id===id) : null;
  const femeas = db.coelhos.filter(c=>c.sexo==='F' && c.status==='matriz');
  const machos = db.coelhos.filter(c=>c.sexo==='M' && !['vendido','abatido','morto'].includes(c.status));
  const mSel = (n&&n.matrizId) || (pre&&pre.matrizId) || '';
  const pSel = (n&&n.padraoId) || (pre&&pre.padraoId) || '';
  const sh = openSheet(n?'Editar ninhada':'Registrar nascimento', `
    <div class="form">
      <div class="frow">
        <div class="fld"><label>Matriz *</label><select id="nMae"><option value="">Selecione</option>${femeas.map(c=>`<option value="${c.id}" ${mSel===c.id?'selected':''}>${esc(c.brinco)}${c.nome?' · '+esc(c.nome):''}</option>`).join('')}</select></div>
        <div class="fld"><label>Padreador</label><select id="nPai"><option value="">Selecione</option>${machos.map(c=>`<option value="${c.id}" ${pSel===c.id?'selected':''}>${esc(c.brinco)}${c.nome?' · '+esc(c.nome):''}</option>`).join('')}</select></div>
      </div>
      <div class="frow">
        <div class="fld"><label>Nascimento</label><input id="nData" type="date" value="${n?n.nascimento||isoHoje():isoHoje()}"></div>
        <div class="fld"><label>Nascidos</label><input id="nNasc" type="number" inputmode="numeric" min="0" value="${n?n.nascidos:''}" placeholder="8"></div>
      </div>
      <div class="fld"><label>Vivos</label><input id="nVivos" type="number" inputmode="numeric" min="0" value="${n?n.vivos:''}" placeholder="7"></div>
      <div class="fld"><label>Observações</label><textarea id="nObs" placeholder="Condições do ninho, transferência de filhotes…">${esc(n?n.obs:'')}</textarea></div>
      <button class="btn primary" id="nSal">${ic('check',18)} Salvar ninhada</button>
    </div>`);
  sh.querySelector('#nSal').onclick = () => {
    const mae = sh.querySelector('#nMae').value;
    if(!mae) return toast('Selecione a matriz','x',true);
    const dados = { matrizId:mae, padraoId:sh.querySelector('#nPai').value || null,
      nascimento:sh.querySelector('#nData').value || isoHoje(),
      nascidos:parseInt(sh.querySelector('#nNasc').value)||0,
      vivos:parseInt(sh.querySelector('#nVivos').value)||0,
      obs:sh.querySelector('#nObs').value.trim() };
    let novoId;
    if(n){ Object.assign(n, dados); novoId = n.id; }
    else { novoId = uid(); db.ninhadas.push({ id:novoId, ...dados }); }
    if(pre && pre.gestId){
      const g = db.acasalamentos.find(x=>x.id===pre.gestId);
      if(g){ g.status = 'nascida'; g.ninhadaId = novoId; }
    }
    save(); sh.close(); toast('Ninhada registrada'); render();
  };
}

/* ============================================================
   MANEJO — SANIDADE + ALIMENTAÇÃO + TAREFAS
   ============================================================ */
function viewManejo(){
  $('#view').innerHTML = `
    <div class="segmini">
      <button data-ms="sanidade" class="${state.msub==='sanidade'?'on':''}">Sanidade</button>
      <button data-ms="alimentacao" class="${state.msub==='alimentacao'?'on':''}">Alimentação</button>
      <button data-ms="tarefas" class="${state.msub==='tarefas'?'on':''}">Tarefas</button>
    </div>
    <div id="msubArea"></div>`;
  $$('#view .segmini button').forEach(b => b.onclick = () => { state.msub = b.dataset.ms; render(); });
  renderMsub();
}

function renderMsub(){
  const area = $('#msubArea'); if(!area) return;
  if(state.msub === 'sanidade'){
    const hoje = isoHoje();
    const carens = ativos()
      .map(c => ({ c, car:carenciaCoelho(c) }))
      .filter(x => x.car)
      .map(x => ({ ...x, dias:Math.round((new Date(x.car.fim+'T00:00') - new Date(hoje+'T00:00'))/864e5) }))
      .sort((a,b)=>a.dias-b.dias);
    const mesKey = hoje.slice(0,7);
    const doMes = db.sanidade.filter(s => (s.data||'').slice(0,7) === mesKey);
    const lista = [...db.sanidade].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
    area.innerHTML = `
      <div class="tira">
        <div class="stat"><b>${carens.length}</b><span>Em carência</span></div>
        <div class="stat"><b>${doMes.length}</b><span>Aplic. no mês</span></div>
        <div class="stat"><b>${db.sanidade.length}</b><span>Total</span></div>
      </div>
      ${carens.length ? `<div class="sec-t" style="margin-top:0">Carência de abate em vigor</div><div id="carens">${carens.map(x=>`
        <div class="carenc-row" data-cid="${x.c.id}">
          <div class="row-ico">${ic('warn',18)}</div>
          <div class="row-main"><b>${esc(x.c.brinco)}${x.c.nome?' · '+esc(x.c.nome):''}</b>
            <span>${esc(x.car.med)} · até ${fmtData(x.car.fim)}</span></div>
          <div class="row-side"><b>${x.dias}</b><span>dias rest.</span></div>
        </div>`).join('')}</div>` : ''}
      <div class="sec-t">Histórico de aplicações</div>
      <div id="lista">${lista.length ? lista.map(s => {
        const temCar = (Number(s.carenciaDias)||0) > 0;
        return `<div class="row" data-id="${s.id}"><div class="row-ico">${ic('syringe',19)}</div>
          <div class="row-main"><b>${esc(s.med)}</b>
            <span>${fmtData(s.data)} · ${esc(alvoDesc(s))}${s.dose?' · '+esc(s.dose):''}</span></div>
          <div class="row-side">${temCar ? `<span class="st carencia">${s.carenciaDias}d</span>` : `<span style="font-size:11px;color:var(--muted)">${esc(s.via||'')}</span>`}</div>
        </div>`;
      }).join('') : `<div class="empty">${ic('syringe',32)}<b>Nenhuma aplicação registrada</b><p>Vermifugações, antibióticos e vitaminas ficam anotados aqui, com o período de carência.</p></div>`}</div>`;
    $$('#carens .carenc-row').forEach(r => r.onclick = () => sheetDetalhe(r.dataset.cid));
    $$('#lista .row').forEach(r => r.onclick = () => sheetSanidadeDet(r.dataset.id));
  } else if(state.msub === 'alimentacao'){
    const mesKey = isoHoje().slice(0,7);
    const doMes = db.alimentacao.filter(a => (a.data||'').slice(0,7) === mesKey);
    const kgMes = doMes.reduce((s,a)=>s+(Number(a.kg)||0),0);
    const comCusto = doMes.filter(a => Number(a.custoKg)>0);
    const custoMes = comCusto.reduce((s,a)=>s + a.kg*a.custoKg, 0);
    const kgCusto = comCusto.reduce((s,a)=>s+a.kg, 0);
    const medio = kgCusto>0 ? custoMes/kgCusto : 0;
    const lista = [...db.alimentacao].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
    area.innerHTML = `
      <div class="tira">
        <div class="stat"><b>${fmtNum(kgMes)}</b><span>Kg no mês</span></div>
        <div class="stat"><b>${custoMes?fmtMoeda(custoMes):'—'}</b><span>Custo no mês</span></div>
        <div class="stat"><b>${medio?fmtMoeda(medio):'—'}</b><span>Média R$/kg</span></div>
      </div>
      <div class="sec-t" style="margin-top:0">Fornecimentos</div>
      <div id="lista">${lista.length ? lista.map(a =>
        `<div class="row" data-id="${a.id}"><div class="row-ico">${ic('balde',19)}</div>
          <div class="row-main"><b>${esc(a.racao)}</b>
            <span>${fmtData(a.data)} · ${esc(alvoDesc(a))}</span></div>
          <div class="row-side"><b>${fmtNum(a.kg)} kg</b><span>${Number(a.custoKg)>0?fmtMoeda(a.kg*a.custoKg):''}</span></div>
        </div>`).join('') : `<div class="empty">${ic('balde',32)}<b>Nenhum fornecimento registrado</b><p>Anote a ração de cada fase e o custo para acompanhar o gasto do mês.</p></div>`}</div>`;
    $$('#lista .row').forEach(r => r.onclick = () => sheetAlimentacaoDet(r.dataset.id));
  } else {
    const hoje = isoHoje();
    const pend = db.tarefas.filter(t=>!t.concluida).sort((a,b)=>(a.data||'').localeCompare(b.data||''));
    const atras = pend.filter(t=>(t.data||'')<hoje).length;
    const hojeN = pend.filter(t=>t.data===hoje).length;
    const conc = db.tarefas.filter(t=>t.concluida).sort((a,b)=>(b.dataConclusao||'').localeCompare(a.dataConclusao||'')).slice(0,8);
    const tipoRow = t => `<div class="trow ${t.data<hoje?'atras':t.data===hoje?'hoje2':''}" data-id="${t.id}">
      <button class="tcheck" data-tk="${t.id}" aria-label="Concluir">${ic('check',17)}</button>
      <div class="row-main"><b>${esc(t.titulo)}</b>

      <span class="st ${t.data<hoje?'falhou':t.data===hoje?'acasalada':'prenhe'}">${t.data<hoje?'atrasada':t.data===hoje?'hoje':'futura'}</span>
    </div>`;

      <div class="tira">
        <div class="stat"><b>${atras}</b><span>Atrasadas</span></div>

        `<div class="trow" data-id="${t.id}" style="opacity:.7">

          <div class="row-main"><b style="text-decoration:line-through">${esc(t.titulo)}</b>
            <span>${esc(t.tipo)} · concluída em ${fmtData(t.dataConclusao||t.data)}</span></div>
        </div>`).join('')}</div>` : ''}`;
    $$('#lista .tcheck, #conc .tcheck').forEach(b => b.onclick = e => { e.stopPropagation(); toggleTarefa(b.dataset.tk); });
    $$('#conc .tundo').forEach(b => b.onclick = e => { e.stopPropagation(); toggleTarefa(b.dataset.ud); });
    $$('#lista .trow, #conc .trow').forEach(r => r.onclick = () => {
      const t = db.tarefas.find(x=>x.id===r.dataset.id);
      if(t && !t.concluida){ t.concluida = true; t.dataConclusao = isoHoje(); save(); toast('Tarefa concluída'); render(); }
    });
  }
}

function toggleTarefa(id){
  const t = db.tarefas.find(x=>x.id===id); if(!t) return;
  t.concluida = !t.concluida;
  t.dataConclusao = t.concluida ? isoHoje() : null;
  save(); toast(t.concluida ? 'Tarefa concluída' : 'Tarefa reaberta'); render();
}

function viewAbates(){
  const mesKey = isoHoje().slice(0,7);
  const doMes = db.abates.filter(a => (a.data||'').slice(0,7)===mesKey);
  const cabecas = doMes.reduce((s,a)=> s + (a.tipo==='lote' ? (a.qtd||0) : 1), 0);
  const rends = db.abates.filter(a => a.vivo>0 && a.carcaca>0).map(a => a.carcaca/a.vivo*100);
  const rendMedio = rends.length ? rends.reduce((s,r)=>s+r,0)/rends.length : 0;
  const lista = [...db.abates].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  $('#view').innerHTML = `
    <div class="tira">
      <div class="stat"><b>${cabecas}</b><span>Abates no mês</span></div>

      <div class="stat"><b>${db.abates.length}</b><span>Total</span></div>

function viewVendas(){

  const lista = [...db.vendas].sort((a,b)=>(b.data||'').localeCompare(a.data||'') || (b.num||0)-(a.num||0));
  let grupos = '', mesAtual = '';
  lista.forEach(v => {

      mesAtual = k;
      const d = new Date(k+'-02');
      grupos += `<div class="grp-h">${d.toLocaleDateString('pt-BR',{month:'long'})} de ${d.getFullYear()}</div>`;
    }
    grupos += `<div class="row" data-id="${v.id}"><div class="row-ico">${ic('tag',19)}</div>

      <div class="row-side"><b>${fmtMoeda(vendaTotal(v))}</b><span>${esc(v.pagamento||'')}</span></div></div>`;

    <div class="tira">
      <div class="stat"><b>${fmtMoeda(totalMes)}</b><span>Faturado no mês</span></div>

/* ============================================================
   GERADOR DE PDF — escrita direta da especificação, sem libs
   ============================================================ */
const HELV = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
function pdfEsc(s){
  s = String(s ?? '');
  const mapa = {'\u20AC':128,'\u2013':150,'\u2014':151,'\u2018':145,'\u2019':146,'\u201C':147,'\u201D':148,'\u2022':149,'\u2026':133,'\u0152':140,'\u0153':156,'\u0160':138,'\u0161':154,'\u017D':142,'\u017E':158};
  let out = '';
  for(const ch of s){
    let c = ch.codePointAt(0);
    if(mapa[ch] !== undefined) c = mapa[ch];
    else if(c > 255) c = 63;
    out += String.fromCharCode(c);
  }
  return out;
}
const pdfTxt = s => pdfEsc(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
function tw(s, f, size){
  const t = pdfEsc(s); let w = 0;
  for(let i=0;i<t.length;i++){ const c = t.charCodeAt(i); w += (c>=32 && c<=126) ? HELV[c-32] : 556; }
  if(f===2) w *= 1.055;
  return w * size / 1000;
}
const r2 = v => Math.round(v*100)/100;
const PC = { green:'0.118 0.227 0.149', white:'1 1 1', ink:'0.133 0.188 0.118', muted:'0.43 0.47 0.40',
  cream:'0.949 0.925 0.863', linec:'0.85 0.82 0.74', carrot:'0.851 0.431 0.188' };
function T(x, y, s, f, size, col, align){
  let xx = x; const w = tw(s, f, size);
  if(align === 'c') xx = x - w/2;
  if(align === 'r') xx = x - w;
  return `q ${col} rg BT /F${f} ${size} Tf 1 0 0 1 ${r2(xx)} ${r2(y)} Tm (${pdfTxt(s)}) Tj ET Q\n`;
}
function R(x, y, w, h, col){ return `q ${col} rg ${r2(x)} ${r2(y)} ${r2(w)} ${r2(h)} re f Q\n`; }
function St(x, y, w, h, col){ return `q ${col} RG 0.9 w ${r2(x)} ${r2(y)} ${r2(w)} ${r2(h)} re S Q\n`; }
function L(x1, y1, x2, y2, col, wd){ return `q ${col} RG ${wd} w ${r2(x1)} ${r2(y1)} m ${r2(x2)} ${r2(y2)} l S Q\n`; }
function truncPdf(s, maxW, f, size){
  s = String(s ?? '');
  if(tw(s,f,size) <= maxW) return s;
  let t = s;
  while(tw(t,f,size) > maxW && t.length > 2) t = t.slice(0,-2);
  return t.trim() + '\u2026';
}
function ellPDF(cx, cy, rx, ry, ang, col){
  const co = Math.cos(ang), si = Math.sin(ang);
  return `q ${col} rg ${r2(rx*co)} ${r2(rx*si)} ${r2(-ry*si)} ${r2(ry*co)} ${r2(cx)} ${r2(cy)} cm ` +
    `1 0 m 1 0.5523 0.5523 1 0 1 c -0.5523 1 -1 0.5523 -1 0 c -1 -0.5523 -0.5523 -1 0 -1 c 0.5523 -1 1 -0.5523 1 0 c h f Q\n`;
}
function logoPDF(cx, cy, r){
  const s = r/28;
  let c = '';
  c += ellPDF(cx, cy, r, r, 0, PC.cream);
  c += ellPDF(cx-8*s,  cy+14*s, 5.2*s, 12*s, -0.22, PC.green);
  c += ellPDF(cx+8*s,  cy+14*s, 5.2*s, 12*s,  0.22, PC.green);
  c += ellPDF(cx, cy-4*s, 13.5*s, 12*s, 0, PC.green);
  c += ellPDF(cx-5*s,  cy-2*s, 1.5*s, 1.9*s, 0, PC.cream);
  c += ellPDF(cx+5*s,  cy-2*s, 1.5*s, 1.9*s, 0, PC.cream);
  c += `q ${PC.carrot} rg ${r2(cx-2.3*s)} ${r2(cy-8*s)} m ${r2(cx+2.3*s)} ${r2(cy-8*s)} l ${r2(cx)} ${r2(cy-10.6*s)} l h f Q\n`;
  return c;
}
const linhaAnimal = a => [a.raca, a.sexo==='M' ? 'Macho' : 'Fêmea', a.idadeTxt, a.peso ? fmtKg(a.peso) : null].filter(Boolean).join('  ·  ');

function buildVendaPdf(v){
  const S = db.settings, W = 595.28, H = 841.89, M = 52, XM = W - M;
  const sub = v.itens.reduce((s,i)=>s+i.qtd*i.preco,0);
  const desc = Number(v.desconto)||0, tot = Math.max(0, sub - desc);
  const brl = n => n.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
  const contato = [S.cidade, S.telefone].filter(Boolean).join('   ·   ') || 'Gestão de cunicultura';
  const fichas = v.itens.filter(i=>i.animal);
  const numTxt = '#' + String(v.num).padStart(4,'0');
  const colH = '0.30 0.34 0.28';

  const pages = [];
  let cur = '', y = 0;

  const startPage = cont => {
    cur = R(0, H-118, W, 118, PC.green)
        + logoPDF(M+38, H-59, 28)
        + T(M+84, H-50, truncPdf(S.nome||'Criatório', 360, 2, 20), 2, 20, PC.white)
        + T(M+84, H-71, truncPdf(contato, 400, 1, 9), 1, 9, PC.white);
    y = H - 152;
    cur += T(W/2, y, 'RECIBO DE VENDA' + (cont ? ' (continuação)' : ''), 2, 15.5, PC.ink, 'c');
    if(!cont) cur += T(W/2, y-15, 'documento não fiscal — controle interno', 1, 8.5, PC.muted, 'c');
    y -= cont ? 34 : 44;
  };
  const endPage = () => { pages.push(cur); cur = ''; };
  const need = h => { if(y - h < 66){ endPage(); startPage(true); return true; } return false; };
  const tabHead = () => {
    cur += R(M, y-20, XM-M, 20, PC.cream)
         + T(M+8, y-14, 'DESCRIÇÃO', 2, 7.5, colH)
         + T(336, y-14, 'QTD', 2, 7.5, colH, 'r')
         + T(444, y-14, 'UNIT. (R$)', 2, 7.5, colH, 'r')
         + T(XM-8, y-14, 'VALOR (R$)', 2, 7.5, colH, 'r');
    y -= 30;
  };

  startPage(false);

  const bh = 76, bw = XM - M;
  cur += R(M, y-bh, bw, bh, PC.cream)
       + T(M+14, y-18, 'CLIENTE', 1, 7, PC.muted)
       + T(M+14, y-35, truncPdf(v.cliente||'Consumidor', bw-330, 2, 12.5), 2, 12.5, PC.ink)
       + T(M+14, y-55, 'PAGAMENTO', 1, 7, PC.muted)
       + T(M+14, y-70, truncPdf(v.pagamento||'—', 240, 2, 10.5), 2, 10.5, PC.ink)
       + T(M+330, y-18, 'NÚMERO', 1, 7, PC.muted)
       + T(M+330, y-35, numTxt, 2, 14, PC.carrot)
       + T(M+330, y-55, 'DATA', 1, 7, PC.muted)
       + T(M+330, y-70, fmtData(v.data), 2, 10.5, PC.ink);
  y -= bh + 20;
  tabHead();

  v.itens.forEach(i => {
    const a = i.animal, two = !!a;
    need(two ? 48 : 36);
    cur += T(M+8, y, truncPdf(i.desc, 250, 2, 10), 2, 10, PC.ink);
    if(a) cur += T(M+8, y-13, truncPdf(linhaAnimal(a), 250, 1, 7.5), 1, 7.5, PC.muted);
    cur += T(336, y, fmtNum(i.qtd)+' '+(i.un||'un'), 1, 9.5, PC.ink, 'r')
         + T(444, y, brl(i.preco), 1, 9.5, PC.ink, 'r')
         + T(XM-8, y, brl(i.qtd*i.preco), 2, 10, PC.ink, 'r')
         + L(M, y-(two?22:16), XM, y-(two?22:16), PC.linec, 0.4);
    y -= two ? 36 : 26;
  });

  need(130);
  let yF = y - 8;
  cur += T(444, yF, 'Subtotal', 1, 9.5, PC.muted, 'r') + T(XM-8, yF, brl(sub), 1, 10, PC.ink, 'r');
  yF -= 17;
  if(desc){ cur += T(444, yF, 'Desconto', 1, 9.5, PC.muted, 'r') + T(XM-8, yF, '-'+brl(desc), 1, 10, PC.ink, 'r'); yF -= 17; }
  cur += R(XM-226, yF-26, 226, 33, PC.green)
       + T(XM-212, yF-16, 'TOTAL', 2, 10.5, PC.white)
       + T(XM-14, yF-15, 'R$ ' + brl(tot), 2, 13.5, PC.white, 'r');
  y = yF - 52;
  if(v.obs){ need(40); cur += T(M, y, truncPdf('Obs.: '+v.obs, 480, 1, 8.5), 1, 8.5, PC.muted); y -= 26; }

  if(fichas.length){
    need(80);
    y -= 12;
    cur += T(M, y, 'FICHA SANITÁRIA — ANIMAIS VENDIDOS', 2, 10.5, PC.green)
         + L(M, y-6, XM, y-6, PC.green, 0.8);
    y -= 24;
    fichas.forEach(i => {
      const a = i.animal, apps = a.sanidade || [];
      const bh2 = 81 + apps.length*13;
      need(bh2 + 14);
      cur += St(M, y-bh2, XM-M, bh2, PC.linec)
           + R(M, y-22, XM-M, 22, PC.cream)
           + T(M+12, y-15, 'BRINCO  ' + a.brinco, 2, 10.5, PC.ink)
           + T(XM-12, y-15, 'vendido em ' + fmtData(v.data), 1, 7.5, PC.muted, 'r');
      let yy = y - 38;
      cur += T(M+12, yy, truncPdf('Raça: ' + (a.raca||'—') + '   ·   ' + (a.sexo==='M'?'Macho':'Fêmea') + '   ·   ' + (a.idadeTxt||'—'), 460, 1, 8.5), 1, 8.5, PC.ink);
      yy -= 13;
      cur += T(M+12, yy, 'Peso: ' + (a.peso ? fmtKg(a.peso) : '—') + '   ·   Nascimento: ' + fmtData(a.nascimento), 1, 8.5, PC.ink);
      yy -= 18;
      if(apps.length){
        cur += T(M+12, yy, 'APLICAÇÕES E VACINAS REGISTRADAS', 1, 6.8, PC.muted);
        yy -= 13;
        apps.forEach(s => {
          const txt = '\u2022  ' + s.med + '  —  ' + fmtData(s.data) +
            (s.carenciaDias ? '  ·  carência até ' + fmtData(addDias(s.data, s.carenciaDias)) : '  ·  sem carência');
          cur += T(M+12, yy, truncPdf(txt, 460, 1, 8.5), 1, 8.5, PC.ink);
          yy -= 13;
        });
      } else {
        cur += T(M+12, yy, 'Sem registros de medicação ou vacinação no período.', 1, 8.5, PC.muted);
      }
      y -= bh2 + 14;
    });
  }

  need(100);
  y -= 6;
  cur += T(W/2, y, 'Obrigado pela preferência!', 2, 11, PC.ink, 'c')
       + L(W/2-105, y-42, W/2+105, y-42, '0.35 0.39 0.33', 0.7)
       + T(W/2, y-55, truncPdf('Assinatura — ' + (S.responsavel || S.nome || 'responsável'), 300, 1, 8), 1, 8, PC.muted, 'c');
  endPage();

  const total = pages.length;
  const fin = pages.map((c, idx) => c
    + R(0, 0, W, 30, PC.cream)
    + T(W/2, 11.5, 'Emitido em ' + fmtDataHora(new Date()) + '  ·  Lepus' + (total>1 ? '  ·  página '+(idx+1)+' de '+total : ''), 1, 7.5, PC.muted, 'c'));

  const nObjs = 4 + fin.length*2;
  const body = new Array(nObjs+1);
  body[1] = '<</Type/Catalog/Pages 2 0 R>>';
  body[2] = `<</Type/Pages/Kids[${fin.map((_,i)=>(5+i*2)+' 0 R').join(' ')}]/Count ${fin.length}>>`;
  body[3] = '<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>';
  body[4] = '<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>';
  fin.forEach((content, i) => {
    const pid = 5+i*2, cid = pid+1;
    body[pid] = `<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents ${cid} 0 R>>`;
    body[cid] = `<</Length ${content.length}>>\nstream\n${content}endstream`;
  });
  let out = '%PDF-1.4\n';
  const offs = [];
  for(let id=1; id<=nObjs; id++){ offs[id] = out.length; out += `${id} 0 obj\n${body[id]}\nendobj\n`; }
  const xref = out.length;
  out += `xref\n0 ${nObjs+1}\n0000000000 65535 f \n`;
  for(let id=1; id<=nObjs; id++) out += String(offs[id]).padStart(10,'0') + ' 00000 n \n';
  out += `trailer\n<</Size ${nObjs+1}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`;
  return new Blob([new Uint8Array([...out].map(ch => ch.charCodeAt(0)))], {type:'application/pdf'});
}

function downloadBlob(blob, nome){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function sharePdf(blob, nome){
  try{
    const file = new File([blob], nome, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title:nome });
      return;
    }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  downloadBlob(blob, nome);
}

function makeIcon(S, maskable){
  const c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = '#1E3A26'; x.fillRect(0,0,S,S);
  const k = maskable ? 0.68 : 0.92;
  x.save();
  x.translate(S/2, S/2); x.scale(k, k); x.translate(-256, -285);
  x.fillStyle = '#F4EFE4';
  const ear = (cx, rot) => { x.save(); x.translate(cx, 205); x.rotate(rot);
    x.beginPath(); x.ellipse(0,0,54,112,0,0,7); x.fill(); x.restore(); };
  ear(210, -0.24); ear(302, 0.24);
  x.beginPath(); x.ellipse(256, 356, 130, 120, 0, 0, 7); x.fill();
  x.fillStyle = '#1E3A26';
  [[210,338],[302,338]].forEach(([ex,ey]) => { x.beginPath(); x.ellipse(ex, ey, 11, 14, 0, 0, 7); x.fill(); });
  x.fillStyle = '#D96E30';
  x.beginPath(); x.moveTo(256, 392); x.lineTo(243, 374); x.lineTo(269, 374); x.closePath(); x.fill();
  x.restore();
  return c.toDataURL('image/png');
}
function setupPWA(){
  if(location.protocol === 'file:'){
    try{
      document.querySelectorAll('link[rel=manifest]').forEach(l => l.remove());
      const t = document.createElement('link');
      t.rel = 'apple-touch-icon'; t.href = makeIcon(180);
      document.head.appendChild(t);
      const man = { name:'Lepus — Cunicultura', short_name:'Lepus',
        description:'Criação, manejo, abates e vendas para cunicultores. Funciona offline.',
        start_url:'.', display:'standalone', background_color:'#F4EFE4', theme_color:'#1E3A26',
        icons:[ {src:makeIcon(192), sizes:'192x192', type:'image/png', purpose:'any'},
                {src:makeIcon(512), sizes:'512x512', type:'image/png', purpose:'any'},
                {src:makeIcon(512, true), sizes:'512x512', type:'image/png', purpose:'maskable'} ] };
      const l = document.createElement('link');
      l.rel = 'manifest';
      l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man));
      document.head.appendChild(l);
    }catch(e){}
  }
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); window._installEvt = e; renderHeader();
  });
  window.addEventListener('appinstalled', () => {
    window._installEvt = null; toast('Lepus instalado no aparelho'); renderHeader();
  });
}
function tentarInstalar(){
  if(window._installEvt){
    window._installEvt.prompt();
    window._installEvt.userChoice.finally(() => { window._installEvt = null; renderHeader(); });
  } else if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
    toast('No iPhone: Compartilhar → Adicionar à Tela de Início','share');
  } else {
    toast('Use o menu do navegador → Instalar app','install');
  }
}

/* ---------- Início ---------- */
setupPWA();
render();
if(!db.settings.configurado) sheetBoasVindas();
</script>
